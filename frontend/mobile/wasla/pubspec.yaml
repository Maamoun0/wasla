name: wasla
description: وصلة — منصة الإعلانات المبوّبة في مصر
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────
  go_router: ^13.2.4

  # ── Backend (Supabase) ────────────────
  supabase_flutter: ^2.5.6

  # ── Firebase (Push Notifications) ─────
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^17.1.2

  # ── Fonts & UI ────────────────────────
  google_fonts: ^6.2.1

  # ── Maps ──────────────────────────────
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # ── Images ────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # ── Payments ──────────────────────────
  webview_flutter: ^4.8.0

  # ── Animations ────────────────────────
  lottie: ^3.1.2

  # ── OTP Input ─────────────────────────
  pin_code_fields: ^8.0.1

  # ── Charts (Ad Performance) ───────────
  fl_chart: ^0.68.0

  # ── Utils ─────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  timeago: ^3.6.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.4.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
