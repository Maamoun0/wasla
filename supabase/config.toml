# Local development configuration for the Supabase CLI.
# Hosted projects are configured in the dashboard; keep the two in sync.
project_id = "wasla"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
# Reference data (governorates, cities, categories, plans, prices) is part of
# the migrations so every environment gets it; there is no dev-only seed yet.
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["wasla://login-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
# One OTP per phone number per minute (the app shows the same countdown).
max_frequency = "60s"
otp_length = 6
otp_expiry = 300

# SMS goes through our own Edge Function (send-sms-hook), not a built-in
# provider: Auth signs each request (Standard Webhooks) and the function picks
# the provider from SMS_PROVIDER. Auth still applies every limit below before
# calling the hook. Values come from supabase/.env (see supabase/.env.example).
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:54321/functions/v1/send-sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRETS)"

# Local only: the CLI turns phone login on only when a built-in provider is
# configured. With the hook enabled Auth never calls it (the hook test proves
# this: these placeholders could not send anything). Not credentials.
[auth.sms.twilio]
enabled = true
account_sid = "local-dev-placeholder"
message_service_sid = "local-dev-placeholder"
auth_token = "local-dev-placeholder"

# Local development only: fixed code for one number. Never configure test
# numbers on a hosted project.
[auth.sms.test_otp]
201000000101 = "123456"

# Server-side Auth limits. The hosted project's values are set in the dashboard
# (Authentication -> Rate Limits); see docs/wasla_production_migration_plan.md.
# Facebook sign-in (FR-1.2). Off locally (needs a Meta app); hosted projects
# enable it in Authentication -> Providers -> Facebook (INTEGRATION_CHECKLIST §7).
[auth.external.facebook]
enabled = false
client_id = ""
secret = ""

[auth.rate_limit]
# SMS messages per hour for the whole project (caps SMS-pumping cost).
sms_sent = 30
# Sign-in / sign-up requests (incl. OTP requests) per 5 minutes per IP.
sign_in_sign_ups = 30
# OTP / token verifications per 5 minutes per IP (brute-forcing codes).
token_verifications = 30
token_refresh = 150
email_sent = 2
anonymous_users = 30

# Admin panel staff must use TOTP (enforced server-side via aal2).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

# Local only. Hosted projects use `supabase secrets set`.
[edge_runtime.secrets]
SEND_SMS_HOOK_SECRETS = "env(SEND_SMS_HOOK_SECRETS)"
SMS_PROVIDER = "env(SMS_PROVIDER)"
TWILIO_ACCOUNT_SID = "env(TWILIO_ACCOUNT_SID)"
TWILIO_AUTH_TOKEN = "env(TWILIO_AUTH_TOKEN)"
TWILIO_FROM = "env(TWILIO_FROM)"
TWILIO_API_BASE = "env(TWILIO_API_BASE)"

[analytics]
enabled = false

# Called by Auth before any user JWT exists; the webhook signature protects it.
[functions.send-sms-hook]
verify_jwt = false

[functions.create-payment]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false
